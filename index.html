<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創客人格測驗</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --teal:    #1D9E75;
    --teal-bg: #E1F5EE;
    --blue:    #185FA5;
    --blue-bg: #E6F1FB;
    --purple:  #534AB7;
    --purple-bg: #EEEDFE;
    --coral:   #993C1D;
    --coral-bg: #FAECE7;
    --bg:      #F7F7F5;
    --white:   #FFFFFF;
    --border:  #E2E2DE;
    --text:    #1A1A18;
    --muted:   #6B6B67;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* ── HERO ── */
  .hero {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 3rem 1.5rem 2.5rem;
    text-align: center;
  }
  .hero-badge {
    display: inline-block;
    padding: 4px 14px;
    background: var(--teal-bg);
    color: var(--teal);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 1rem;
  }
  .hero h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: .75rem;
  }
  .hero p {
    font-size: 15px;
    color: var(--muted);
    max-width: 400px;
    margin: 0 auto 1.5rem;
    line-height: 1.6;
  }

  /* ── CARD ── */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .card h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .6rem;
  }

  /* ── CONTAINER ── */
  .container { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem; }

  /* ── FORM ── */
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 15px; font-family: inherit; background: var(--white);
    color: var(--text); transition: border-color .15s;
  }
  .field input:focus { outline: none; border-color: var(--teal); }
  .field .err { font-size: 12px; color: #c0392b; margin-top: 4px; min-height: 16px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 28px; border-radius: var(--radius);
    font-size: 15px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: opacity .15s, transform .1s; border: none;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .35; cursor: default; }
  .btn-outline {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { background: var(--bg); }
  .btn-danger { background: transparent; color: #c0392b; border: 1px solid #f5c6c6; }
  .btn-danger:hover { background: #fff5f5; }
  .btn-full { width: 100%; }

  /* ── PROGRESS ── */
  .prog-wrap { margin-bottom: 1.2rem; }
  .prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .prog-bg { height: 5px; background: var(--border); border-radius: 3px; }
  .prog-fill { height: 5px; background: var(--teal); border-radius: 3px; transition: width .35s ease; }

  /* ── QUESTION ── */
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.5; margin-bottom: 1.2rem; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 15px;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; text-align: left;
    font-size: 14px; color: var(--text); font-family: inherit;
    transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: var(--teal); background: var(--teal-bg); }
  .opt.sel { border-color: var(--teal); background: var(--teal-bg); }
  .opt-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0;
  }
  .opt.sel .opt-letter { background: var(--teal); color: #fff; border-color: var(--teal); }
  .q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; }

  /* ── RESULT ── */
  .result-hero {
    text-align: center; padding: 1.5rem;
    border-radius: var(--radius); margin-bottom: 1rem;
  }
  .result-icon { font-size: 48px; margin-bottom: .5rem; }
  .result-name { font-size: 22px; font-weight: 700; }
  .result-sub { font-size: 14px; margin-top: 4px; opacity: .75; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin: 3px 3px 0 0; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { font-size: 13px; color: var(--muted); width: 72px; flex-shrink: 0; }
  .bar-bg { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; }
  .bar-fill { height: 7px; border-radius: 4px; }
  .bar-pct { font-size: 12px; color: var(--muted); width: 30px; text-align: right; }

  /* ── TEACHER DASHBOARD ── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 1.2rem; }
  .stat-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
  .stat-n { font-size: 24px; font-weight: 700; }
  .stat-l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg); padding: 9px 12px; text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: .75rem; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.2rem 0; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
  .teacher-header h2 { font-size: 18px; font-weight: 700; }

  /* ── NAV BAR ── */
  .nav-bar {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: .75rem 1rem; display: flex; align-items: center; justify-content: space-between;
  }
  .nav-bar .logo { font-size: 15px; font-weight: 700; color: var(--teal); }
  .nav-bar .nav-link { font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }
  .nav-bar .nav-link:hover { color: var(--teal); }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }

  /* ── CONFIG NOTICE ── */
  .config-notice {
    background: #FFF8E1; border: 1px solid #FFE082;
    border-radius: var(--radius); padding: 1rem 1.2rem; margin-bottom: 1rem;
    font-size: 14px; line-height: 1.6;
  }
  .config-notice strong { color: #8a6200; }
  .config-notice code {
    background: #FFF3CD; padding: 1px 6px; border-radius: 4px;
    font-family: monospace; font-size: 13px;
  }

  .detail-panel {
    display: none; background: var(--bg);
    border-top: 1px solid var(--border); padding: 12px 14px;
  }
  .detail-panel.open { display: block; }
  .detail-q { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .detail-a { font-size: 13px; color: var(--text); margin-bottom: 10px; padding-left: 8px; border-left: 2px solid var(--teal); }
  .expand-btn { background: none; border: none; cursor: pointer; color: var(--teal); font-size: 13px; font-family: inherit; padding: 0; }
  .expand-btn:hover { text-decoration: underline; }
  .btn-export { background: var(--teal); color: #fff; }
  .btn-export:hover { opacity: .9; }
  @media print {
    .nav-bar, .row-btns, #page-start, #page-quiz, #page-teacher-login, #page-teacher { display: none !important; }
    #page-result { display: block !important; }
    .pdf-header { display: block !important; }
    body { background: #fff; }
    .container { max-width: 100%; padding: 0 1rem; }
    .card { break-inside: avoid; border: 1px solid #ddd; }
  }
  .pdf-header { display: none; text-align: center; padding: 1rem 0 .5rem; }
  .pdf-header h2 { font-size: 18px; font-weight: 700; }
  .pdf-header p { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    .hero { padding: 2rem 1rem 1.5rem; }
    .container { padding: 1rem .75rem; }
    .q-text { font-size: 15px; }
    table { font-size: 12px; }
    th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<div class="nav-bar">
  <span class="logo">創客人格測驗</span>
  <button class="nav-link" onclick="showPage('teacher-login')">老師入口</button>
</div>

<!-- ═══ PAGE: START ═══ -->
<div id="page-start" class="page active">
  <div class="hero">
    <div class="hero-badge">科技專題研究</div>
    <h1>找到屬於你的<br>創客人格</h1>
    <p>10 個問題，3 分鐘，幫你找到最適合的科技專題方向。</p>
  </div>
  <div class="container">
    <div class="config-notice" id="config-notice" style="display:none">
      <strong>⚠️ 尚未設定 Firebase</strong><br>
      請打開 index.html，找到 <code>firebaseConfig</code> 區塊，填入你的 Firebase 專案設定。<br>
      詳細步驟請見 <strong>setup-guide.md</strong>。
    </div>
    <div class="card">
      <h3>填寫基本資料</h3>
      <div class="field">
        <label>姓名</label>
        <input type="text" id="inp-name" placeholder="你的名字" oninput="clearE('e-name')">
        <div class="err" id="e-name"></div>
      </div>
      <div class="field">
        <label>班級</label>
        <input type="text" id="inp-class" placeholder="例如：803班" oninput="clearE('e-class')">
        <div class="err" id="e-class"></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="startQuiz()">開始測驗</button>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--muted);margin-top:.75rem">共 10 題・約 3 分鐘</div>
  </div>
</div>

<!-- ═══ PAGE: QUIZ ═══ -->
<div id="page-quiz" class="page">
  <div class="container">
    <div class="prog-wrap">
      <div class="prog-meta">
        <span id="q-num"></span>
        <span id="q-emoji"></span>
      </div>
      <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
    <div class="q-nav">
      <button class="btn btn-outline" id="btn-prev" onclick="prevQ()">← 上一題</button>
      <button class="btn btn-primary" id="btn-next" disabled onclick="nextQ()">下一題</button>
    </div>
  </div>
</div>

<!-- ═══ PAGE: RESULT ═══ -->
<div id="page-result" class="page">
  <div class="container">
    <div class="pdf-header">
      <h2>創客人格測驗結果</h2>
      <p id="pdf-meta"></p>
    </div>
    <div id="result-content"></div>
    <div class="row-btns" style="margin-top:1rem">
      <button class="btn btn-outline" onclick="resetQuiz()">重新測驗</button>
      <button class="btn btn-primary" onclick="downloadPDF()">下載結果 PDF</button>
    </div>
  </div>
</div>

<!-- ═══ PAGE: TEACHER LOGIN ═══ -->
<div id="page-teacher-login" class="page">
  <div class="container">
    <div class="card">
      <h3>老師入口</h3>
      <div class="field" style="margin-top:.5rem">
        <label>密碼</label>
        <input type="password" id="inp-pwd" placeholder="輸入老師密碼" oninput="clearE('e-pwd')">
        <div class="err" id="e-pwd"></div>
      </div>
      <div class="row-btns">
        <button class="btn btn-primary" onclick="teacherLogin()">進入</button>
        <button class="btn btn-outline" onclick="showPage('start')">返回</button>
      </div>

    </div>
  </div>
</div>

<!-- ═══ PAGE: TEACHER DASHBOARD ═══ -->
<div id="page-teacher" class="page">
  <div class="container">
    <div class="teacher-header">
      <h2>測驗結果總覽</h2>
      <button class="btn btn-outline" style="padding:6px 14px;font-size:13px" onclick="showPage('start')">返回首頁</button>
    </div>
    <div id="dashboard-content"><div class="loading">載入中...</div></div>
  </div>
</div>

  /* ▲▲▲  填入結束  ▲▲▲ */

  const TEACHER_PWD = "teacher123"; // 可修改老師密碼

  let app, db, configured = false;
  try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      app = initializeApp(firebaseConfig);
      db  = getFirestore(app);
      configured = true;
    }
  } catch(e) { console.error(e); }

  if (!configured) document.getElementById("config-notice").style.display = "block";

  /* ── 資料 ── */
  const questions = [
    {q:"假日有空的時候，你比較喜歡做什麼？",e:"🌟",opts:[{t:"拆開東西研究怎麼運作",ty:"inventor"},{t:"想像一個不存在的世界或故事",ty:"creator"},{t:"找資料、比較、整理筆記",ty:"researcher"},{t:"思考怎麼幫助身邊的人",ty:"changer"}]},
    {q:"看到生活中一個問題，你第一個反應是？",e:"💡",opts:[{t:"馬上動手想怎麼解決",ty:"inventor"},{t:"先觀察，搜集更多資訊",ty:"researcher"},{t:"想一個有創意的解決方案",ty:"creator"},{t:"想這個問題影響了哪些人",ty:"changer"}]},

    {q:"小組合作時，你通常扮演什麼角色？",e:"👥",opts:[{t:"負責把想法做出來的人",ty:"inventor"},{t:"讓報告或作品變好看的人",ty:"creator"},{t:"查資料確認事實的人",ty:"researcher"},{t:"協調大家意見的人",ty:"changer"}]},

  ];

  const types = {
    inventor:   {name:"發明家型",icon:"🔧",color:"#1D9E75",bg:"#E1F5EE",desc:"你喜歡動手做、解決實際問題，擅長把想法變成真實成品。",topics:["Arduino互動裝置","智慧家庭系統","機器人設計","感測器應用","3D列印專題"]},

  let userName="", userClass="";

  /* ── 頁面切換 ── */
  window.showPage = (id) => {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page-"+id).classList.add("active");
    window.scrollTo(0,0);
  };

  /* ── 清錯誤 ── */
  window.clearE = (id) => document.getElementById(id).textContent = "";

  /* ── 開始測驗 ── */
  window.startQuiz = () => {
    const n = document.getElementById("inp-name").value.trim();
    const c = document.getElementById("inp-class").value.trim();
    let ok = true;
    if (!n) { document.getElementById("e-name").textContent = "請輸入姓名"; ok=false; }
    if (!c) { document.getElementById("e-class").textContent = "請輸入班級"; ok=false; }
    if (!ok) return;
    userName=n; userClass=c;
    cur=0; scores={inventor:0,creator:0,researcher:0,changer:0}; sel=null; answers=[];
    showPage("quiz"); renderQ();
  };

  function renderQ() {
    const q = questions[cur];
    document.getElementById("q-num").textContent = `問題 ${cur+1} / ${questions.length}`;
    document.getElementById("q-emoji").textContent = q.e;
    document.getElementById("q-text").textContent = q.q;
    document.getElementById("prog-fill").style.width = ((cur+1)/questions.length*100)+"%";
    sel = answers[cur] || null;
    const btn = document.getElementById("btn-next");
    btn.disabled = !sel;
    btn.textContent = cur === questions.length-1 ? "查看結果 ✨" : "下一題";

    const prevBtn = document.getElementById("btn-prev");
    prevBtn.style.visibility = cur === 0 ? "hidden" : "visible";

    const opts = document.getElementById("opts");
    opts.innerHTML = "";
    ["A","B","C","D"].forEach((L,i) => {
      const o = q.opts[i];
      const b = document.createElement("button");
      b.className = "opt" + (sel === o.ty ? " sel" : "");
      b.innerHTML = `<span class="opt-letter">${L}</span><span>${o.t}</span>`;
      b.onclick = () => {
        document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel"); sel = o.ty;
        answers[cur] = o.ty;
        document.getElementById("btn-next").disabled = false;
      };
      opts.appendChild(b);
    });
  }

  window.nextQ = () => {
    if (!sel) return;
    answers[cur] = sel;
    cur++;
    if (cur >= questions.length) {
      scores = {inventor:0,creator:0,researcher:0,changer:0};
      answers.forEach(a => scores[a]++);
      showResult();
    } else renderQ();
  };

  window.prevQ = () => {
    if (cur === 0) return;
    cur--;
    renderQ();
  };

  async function showResult() {
    const top = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    const t = types[top];
    const total = questions.length;
    const pct = k => Math.round(scores[k]/total*100);

    /* 儲存到 Firebase */
    if (configured) {
      try {
        await addDoc(collection(db, "quiz_results"), {
          name: userName, class: userClass, type: top,
          scores: {...scores}, answers: [...answers], time: serverTimestamp()
        });
      } catch(e) { console.error("儲存失敗:", e); }
    }

    const bars = Object.keys(types).map(k => {
      const p = pct(k);
      return `<div class="bar-row">
        <span class="bar-label">${types[k].icon} ${types[k].name.replace("型","")}</span>
        <div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${types[k].color}"></div></div>
        <span class="bar-pct">${p}%</span>
      </div>`;
    }).join("");

    const tags = t.topics.map(tp =>
      `<span class="tag" style="background:${t.bg};color:${t.color}">${tp}</span>`
    ).join("");

    document.getElementById("result-content").innerHTML = `
      <div class="result-hero" style="background:${t.bg}">
        <div class="result-icon">${t.icon}</div>
        <div class="result-name" style="color:${t.color}">${t.name}</div>
        <div class="result-sub" style="color:${t.color}">${userName} 同學</div>
      </div>
      <div class="card"><h3>你的特質</h3><p style="font-size:14px;line-height:1.7">${t.desc}</p></div>
      <div class="card"><h3>適合的專題方向</h3><div style="margin-top:4px">${tags}</div></div>
      <div class="card"><h3>各類型分佈</h3><div style="margin-top:8px">${bars}</div></div>`;

    document.getElementById("pdf-meta").textContent =
      `${userName} 同學・${userClass}・${new Date().toLocaleDateString("zh-TW")}`;
    showPage("result");
  }

  window.resetQuiz = () => {
    document.getElementById("inp-name").value = "";
    document.getElementById("inp-class").value = "";
    showPage("start");
  };

  /* ── 老師登入 ── */
  window.teacherLogin = async () => {
    const p = document.getElementById("inp-pwd").value;
    if (p !== TEACHER_PWD) { document.getElementById("e-pwd").textContent = "密碼錯誤"; return; }
    showPage("teacher");
    await loadDashboard();
  };

  async function loadDashboard() {
    const el = document.getElementById("dashboard-content");
    if (!configured) {
      el.innerHTML = `<div class="config-notice"><strong>尚未設定 Firebase</strong><br>請先完成 Firebase 設定才能收集資料。</div>`;
      return;
    }
    el.innerHTML = `<div class="loading">載入中...</div>`;
    try {
      const q = query(collection(db,"quiz_results"), orderBy("time","desc"));
      const snap = await getDocs(q);
      const all = snap.docs.map(d => ({id:d.id, ...d.data()}));

      if (all.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>還沒有學生完成測驗</p></div>`;
        return;
      }

      const counts = {inventor:0,creator:0,researcher:0,changer:0};
      all.forEach(r => counts[r.type]++);

      const totalQ = questions.length;
      const accumulated = {inventor:0,creator:0,researcher:0,changer:0};
      all.forEach(r => {
        if (r.scores) {
          Object.keys(accumulated).forEach(k => {
            accumulated[k] += (r.scores[k] || 0);
          });
        }
      });
      const grandTotal = Object.values(accumulated).reduce((a,b)=>a+b, 0) || 1;

      const statsHTML = `<div class="stats-row">
        <div class="stat-box"><div class="stat-n">${all.length}</div><div class="stat-l">完成人數</div></div>
        ${Object.entries(counts).map(([k,v])=>`
          <div class="stat-box">
            <div class="stat-n">${types[k].icon} ${v}</div>
            <div class="stat-l">${types[k].name}</div>
          </div>`).join("")}
      </div>`;

      const barsHTML = Object.entries(accumulated).map(([k,v])=>{
        const p = Math.round(v/grandTotal*100);
        return `<div class="bar-row">
          <span class="bar-label">${types[k].icon} ${types[k].name.replace("型","")}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${types[k].color}"></div></div>
          <span class="bar-pct">${p}%</span>
        </div>`;
      }).join("");

      window._allResults = all;

      const rows = all.map((r, idx) => {
        const t = types[r.type];
        const time = r.time?.toDate ? r.time.toDate().toLocaleString("zh-TW",{hour12:false}) : "—";
        const scoreBreakdown = r.scores
          ? Object.entries(types).map(([k,tv])=>{
              const sc = r.scores[k] || 0;
              const p = Math.round(sc/totalQ*100);
              return `<span style="font-size:11px;margin-right:6px;color:${tv.color}">${tv.icon}${p}%</span>`;
            }).join("")
          : "";

        const detailRows = r.answers
          ? questions.map((q, qi) => {
              const ans = r.answers[qi];
              const chosenOpt = ans ? q.opts.find(o => o.ty === ans) : null;
              const chosenType = ans ? types[ans] : null;
              return `<div class="detail-q">Q${qi+1}. ${q.q}</div>
                <div class="detail-a" style="border-color:${chosenType ? chosenType.color : '#ccc'}">
                  ${chosenOpt ? chosenOpt.t : '—'}
                  ${chosenType ? `<span style="font-size:11px;color:${chosenType.color};margin-left:6px">${chosenType.icon}${chosenType.name}</span>` : ''}
                </div>`;
            }).join("")
          : "<div style='font-size:13px;color:var(--muted)'>此學生作答時未記錄詳細選項（舊版資料）</div>";

        return `<tr>
          <td><button class="expand-btn" onclick="toggleDetail(${idx})" id="expand-${idx}">▶ ${r.name}</button></td>
          <td>${r.class}</td>
          <td><span class="type-badge" style="background:${t.bg};color:${t.color}">${t.icon} ${t.name}</span></td>
          <td style="color:var(--muted);font-size:12px">${scoreBreakdown}</td>
          <td style="color:var(--muted)">${time}</td>
        </tr>
        <tr id="detail-row-${idx}">
          <td colspan="5" style="padding:0">
            <div class="detail-panel" id="detail-${idx}">${detailRows}</div>
          </td>
        </tr>`;
      }).join("");

      el.innerHTML = `
        ${statsHTML}
        <div class="card"><h3>全班人格分佈（累計得分）</h3><div style="margin-top:8px">${barsHTML}</div></div>
        <div class="table-wrap" style="margin-bottom:1rem">
          <table>
            <thead><tr><th>姓名（點擊展開）</th><th>班級</th><th>主要人格</th><th>各類型分佈</th><th>完成時間</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="row-btns">
          <button class="btn btn-outline" onclick="loadDashboard()">重新整理</button>
          <button class="btn btn-export" onclick="exportExcel()">匯出 Excel</button>
          <button class="btn btn-danger" onclick="clearAllData()">清除全部資料</button>
        </div>`;

    } catch(e) {
      el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>載入失敗：${e.message}</p></div>`;
    }
  }

  window.loadDashboard = loadDashboard;

  window.downloadPDF = () => {
    const name = document.getElementById("pdf-meta").textContent.split("・")[0] || "學生";
    document.title = `創客人格測驗_${name}`;
    window.print();
    setTimeout(() => { document.title = "創客人格測驗"; }, 2000);
  };

  window.clearAllData = async () => {
    if (!confirm("確定要刪除所有學生測驗結果嗎？此動作無法復原。")) return;
    try {
      const snap = await getDocs(collection(db,"quiz_results"));
      await Promise.all(snap.docs.map(d => deleteDoc(doc(db,"quiz_results",d.id))));
      await loadDashboard();
    } catch(e) { alert("刪除失敗："+e.message); }
  };

  window.toggleDetail = (idx) => {
    const panel = document.getElementById("detail-"+idx);
    const btn   = document.getElementById("expand-"+idx);
    const name  = window._allResults[idx].name;
    const isOpen = panel.classList.contains("open");
    document.querySelectorAll(".detail-panel").forEach(p => p.classList.remove("open"));
    document.querySelectorAll(".expand-btn").forEach((b,i) => {
      b.textContent = "▶ " + window._allResults[i].name;
    });
    if (!isOpen) {
      panel.classList.add("open");
      btn.textContent = "▼ " + name;
    }
  };

  window.exportExcel = () => {
    const all = window._allResults || [];
    if (!all.length) { alert("沒有資料可以匯出"); return; }

    const typeKeys = ["inventor","creator","researcher","changer"];
    const typeNames = {inventor:"發明家型",creator:"創作者型",researcher:"研究員型",changer:"改革者型"};

    const header = ["姓名","班級","主要人格",
      "發明家%","創作者%","研究員%","改革者%",
      ...questions.map((_,i)=>`Q${i+1}`),
      "完成時間"].join("\t");

    const rows = all.map(r => {
      const time = r.time?.toDate ? r.time.toDate().toLocaleString("zh-TW",{hour12:false}) : "—";
      const pcts = typeKeys.map(k => {
        const sc = r.scores ? (r.scores[k]||0) : 0;
        return Math.round(sc/questions.length*100)+"%";
      });
      const answerTexts = questions.map((q,qi) => {
        const ans = r.answers ? r.answers[qi] : null;
        if (!ans) return "—";
        const opt = q.opts.find(o=>o.ty===ans);
        return opt ? opt.t : "—";
      });
      return [r.name, r.class, typeNames[r.type]||r.type,
        ...pcts, ...answerTexts, time].join("\t");
    });

    const tsv = [header, ...rows].join("\n");
    const bom = "\uFEFF";
    const blob = new Blob([bom+tsv], {type:"text/tab-separated-values;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "創客人格測驗結果.xls";
    a.click();
    URL.revokeObjectURL(url);
  };
</script>
</body>
</html>
